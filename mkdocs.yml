# mkdocs.yml — the public learning site, built from docs/ and published to GitHub Pages.
#
# The site is the docs folder as it is on GitHub, dressed. Nothing here is rewritten by hand: links
# into src/ and test/ become GitHub links at build time (docs-site/hooks.py), and each page wears the
# colour of the level it sits on. Run it locally with
#
#   pip install -r docs-site/requirements.txt
#   mkdocs serve

site_name: MLambda.AI
site_description: >-
  Learn artificial intelligence by reading real Hilbert source: logic, agents, machine learning and
  reinforcement learning, at three levels, every sample compiled and every proof checked.
site_url: https://www.mlambda.net/MLambda.AI/
repo_url: https://github.com/mlambda-net/MLambda.AI
repo_name: mlambda-net/MLambda.AI
edit_uri: edit/master/docs/
copyright: MLambda.AI · every sample compiled, every theorem checked · <a href="https://www.mlambda.net">mlambda.net</a>

docs_dir: docs
exclude_docs: |
  /README.md
  /superpowers/

theme:
  name: material
  custom_dir: docs-site/overrides
  logo: assets/images/favicon.svg
  favicon: assets/images/favicon.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/stylesheets/mlambda.css

extra_javascript:
  - assets/javascripts/hilbert.js

hooks:
  - docs-site/hooks.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Ideas:
      - ideas/README.md
      - ideas/thinking-machines.md
      - ideas/modal-systems.md
      - ideas/semantics-and-accountability.md
      - ideas/neuro-symbolic.md
  - Hilbert:
      - hilbert/01-what-hilbert-is.md
      - hilbert/02-the-four-dialects.md
      - hilbert/03-how-the-build-works.md
      - hilbert/04-the-prelude.md
      - hilbert/05-reading-a-proof.md
      - hilbert/06-diagnostics.md
  - L1 Novice:
      - L1-novice/README.md
      - L1-novice/logic.md
      - L1-novice/agent.md
      - L1-novice/ml.md
      - L1-novice/learning.md
      - L1-novice/minds.md
  - L2 Practitioner:
      - L2-practitioner/README.md
      - L2-practitioner/logic.md
      - L2-practitioner/agent.md
      - L2-practitioner/ml.md
      - L2-practitioner/learning.md
      - L2-practitioner/minds.md
  - L3 Advanced:
      - L3-advanced/README.md
      - L3-advanced/logic.md
      - L3-advanced/agent.md
      - L3-advanced/ml.md
      - L3-advanced/learning.md
      - L3-advanced/minds.md
  - Capstone:
      - actuarial/README.md
      - actuarial/valuation.md
      - actuarial/condition.md
      - actuarial/credit.md
      - actuarial/adjudicator.md
  - Case study:
      - airline/README.md
      - airline/rules.md
      - airline/time.md
      - airline/hacking.md
      - airline/writing-rules.md
