name: CI

# Build + test on every push and pull request; an RC package on every push to master; a release on a
# v-tag (`./versioning patch`). The steps are Genesis's shared dotnet.yml, which every MLambda repo runs.

on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write

jobs:
  dotnet:
    uses: mlambda-net/MLambda.Genesis/.github/workflows/dotnet.yml@standarize
    with:
      mode: mounted
      publish: false
    secrets: inherit
