# pages.yml — publish the learning site to GitHub Pages.
#
# ONLY THE SITE, ON PURPOSE. The samples build against a sibling checkout of MLambda.Genesis, which a
# runner does not have, so there is no `dotnet build` or `dotnet test` here yet. When Hilbert ships as
# NuGet packages, a build-and-test job belongs beside this one.

name: Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt

      - name: Install MkDocs Material
        run: pip install -r docs-site/requirements.txt

      - name: Build the site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
